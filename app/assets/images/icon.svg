<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Mimoza app icon">
  <defs>
    <!-- Radial rather than linear: the ground lifts behind the bloom and falls
         away at the corners, which keeps the tile from reading flat. -->
    <radialGradient id="bg" cx="42%" cy="36%" r="78%">
      <stop stop-color="#4C5F52"/>
      <stop offset="1" stop-color="#101713"/>
    </radialGradient>
    <!-- Petals stay cool. Warming them toward the heart's gold is what collapsed
         the contrast between the two — the separation here is temperature, not
         brightness, so the yellow can stay soft. -->
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FBF8F0" stop-opacity=".95"/>
      <stop offset="1" stop-color="#B6C2B6" stop-opacity=".58"/>
    </linearGradient>
    <radialGradient id="center" cx="38%" cy="32%" r="72%">
      <stop stop-color="#FBDA8E"/>
      <stop offset="1" stop-color="#CE9433"/>
    </radialGradient>

    <!-- Six round petals rather than eight narrow ones: they meet only near the
         hub, so the overlap reads as a light seam instead of a full weave. -->
    <g id="ring">
      <ellipse cy="-178" rx="125" ry="160"/>
      <ellipse cy="-178" rx="125" ry="160" transform="rotate(60)"/>
      <ellipse cy="-178" rx="125" ry="160" transform="rotate(120)"/>
      <ellipse cy="-178" rx="125" ry="160" transform="rotate(180)"/>
      <ellipse cy="-178" rx="125" ry="160" transform="rotate(240)"/>
      <ellipse cy="-178" rx="125" ry="160" transform="rotate(300)"/>
    </g>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <g transform="translate(512 512)">
    <g fill="url(#petal)"><use href="#ring"/></g>
    <circle r="98" fill="url(#center)"/>
  </g>
</svg>
