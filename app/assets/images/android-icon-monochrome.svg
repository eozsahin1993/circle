<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Mimoza monochrome icon">
  <!-- Themed icons get tinted by the launcher, so this is a flat silhouette:
       no gradients, no translucency, one solid fill. -->
  <g transform="translate(512 512) scale(0.92)" fill="#FFFFFF">
    <ellipse cy="-178" rx="125" ry="160"/>
    <ellipse cy="-178" rx="125" ry="160" transform="rotate(60)"/>
    <ellipse cy="-178" rx="125" ry="160" transform="rotate(120)"/>
    <ellipse cy="-178" rx="125" ry="160" transform="rotate(180)"/>
    <ellipse cy="-178" rx="125" ry="160" transform="rotate(240)"/>
    <ellipse cy="-178" rx="125" ry="160" transform="rotate(300)"/>
    <circle r="98"/>
  </g>
</svg>
