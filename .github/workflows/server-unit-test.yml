name: Server Unit Tests

on:
  push:
    branches: [main]
    # Includes this workflow itself, so a change to it is validated by
    # the run it defines rather than waiting for the next server/ commit.
    paths: ['server/**', '.github/workflows/server-unit-test.yml']
  pull_request:
    branches: [main]
    paths: ['server/**', '.github/workflows/server-unit-test.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      localstack:
        image: localstack/localstack:4.4.0
        ports:
          - 4566:4566
        env:
          SERVICES: dynamodb,s3
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # The service container's health check only says the gateway is up;
      # the individual services come available after it. Waiting here
      # rather than in the tests keeps a slow start from looking like a
      # storage bug, and names the problem when it really is one.
      - name: Wait for DynamoDB and S3
        run: |
          for _ in $(seq 1 30); do
            health=$(curl -sf http://localhost:4566/_localstack/health || true)
            if printf '%s' "$health" | grep -Eq '"dynamodb": *"(available|running)"' &&
               printf '%s' "$health" | grep -Eq '"s3": *"(available|running)"'; then
              echo "ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::LocalStack never reported dynamodb and s3 as ready"
          echo "last health response: $health"
          exit 1

      # Runs before Build, because an untidy go.mod fails the build here
      # with "updates to go.mod needed" — which reads as a broken build
      # rather than a missing requirement. A warm module cache hides this
      # locally: `go build` succeeds on the developer's machine using a
      # package go.mod never recorded, and only a clean checkout notices.
      - name: Check go.mod is tidy
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::go.mod/go.sum are not tidy — run 'go mod tidy' in server/ and commit the result"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      # Fails rather than skips if LocalStack never came up. Every
      # storage-backed test here skips when it can't reach one, which is
      # right on a laptop and wrong in CI: a broken container would leave
      # the run green while checking nothing.
      - name: Test
        run: go test ./... -race
        env:
          BLACKBOX_REQUIRE_RELAY: '1'
