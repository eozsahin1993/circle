name: Server Tests

on:
  push:
    branches: [main]
    # Includes this workflow itself, so a change to it is validated by
    # the run it defines rather than waiting for the next server/ commit.
    paths: ['server/**', '.github/workflows/server-test.yml']
  pull_request:
    branches: [main]
    paths: ['server/**', '.github/workflows/server-test.yml']
  workflow_dispatch:

jobs:
  # Everything that needs no service container: the static checks, and the
  # handful of packages with no LocalStack dependency at all (see their
  # list below). No `services:` block, so this starts running the instant
  # a runner is free rather than waiting on a container to boot — the
  # cheap, fast-feedback half of the split.
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # Runs before Build, because an untidy go.mod fails the build here
      # with "updates to go.mod needed" — which reads as a broken build
      # rather than a missing requirement. A warm module cache hides this
      # locally: `go build` succeeds on the developer's machine using a
      # package go.mod never recorded, and only a clean checkout notices.
      - name: Check go.mod is tidy
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::go.mod/go.sum are not tidy — run 'go mod tidy' in server/ and commit the result"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      # Only the packages whose tests touch no storage adapter at all —
      # everything else constructs a real DynamoDB/S3 client (see
      # internal/testsupport's package doc) and belongs in the integration
      # job below. Named explicitly, not discovered, so this job's pass
      # means what "unit tests" is supposed to mean: nothing here skipped
      # for want of a service container. The integration job runs the
      # full `./...` regardless, so a stale entry here undertests this job
      # without ever leaving a gap in what CI as a whole checks.
      - name: Test
        run: |
          go test -race \
            ./internal/api/auth/oidcverify/... \
            ./internal/api/push/... \
            ./internal/push/fcm/... \
            ./internal/storage/dynamoutil/...

  # Everything that talks to LocalStack: the storage adapters, the routed
  # API against real adapters, and integration/ — the sequences that drive
  # a real relay over HTTP (create an invite, request against it, approve,
  # read it back). Gated on unit passing first, so a broken build doesn't
  # spend a container's boot time finding that out a second way.
  integration:
    name: Integration Tests
    needs: unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      localstack:
        image: localstack/localstack:4.4.0
        ports:
          - 4566:4566
        env:
          SERVICES: dynamodb,s3
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # The service container's health check only says the gateway is up;
      # the individual services come available after it. Waiting here
      # rather than in the tests keeps a slow start from looking like a
      # storage bug, and names the problem when it really is one.
      - name: Wait for DynamoDB and S3
        run: |
          for _ in $(seq 1 30); do
            health=$(curl -sf http://localhost:4566/_localstack/health || true)
            if printf '%s' "$health" | grep -Eq '"dynamodb": *"(available|running)"' &&
               printf '%s' "$health" | grep -Eq '"s3": *"(available|running)"'; then
              echo "ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::LocalStack never reported dynamodb and s3 as ready"
          echo "last health response: $health"
          exit 1

      # ./... rather than the LocalStack-dependent subset by name: this is
      # the safety net for the unit job's explicit list above, so nothing
      # this module has is ever missing from CI as a whole. The four pure
      # packages just run twice, which costs a fraction of a second.
      #
      # Fails rather than skips if LocalStack never came up — every
      # storage-backed test here otherwise treats that as "not my job to
      # decide", which is right on a laptop and wrong in a pipeline: a
      # broken container would leave this job green having checked nothing.
      - name: Test
        run: go test ./... -race
        env:
          REQUIRE_LOCALSTACK: '1'
