name: Server Tests

# Least privilege: nothing here needs to write to the repo, so a workflow
# permissions block that widened later (or a default that already had)
# can't hand this job more than read access.
permissions:
  contents: read

on:
  push:
    branches: [main]
    # Includes this workflow itself, so a change to it is validated by
    # the run it defines rather than waiting for the next server/ commit.
    paths: ['server/**', '.github/workflows/server-test.yml']
  pull_request:
    branches: [main]
    paths: ['server/**', '.github/workflows/server-test.yml']
  workflow_dispatch:

jobs:
  # Static checks plus every package test except the black-box suite —
  # most of these are LocalStack-backed adapter tests, hence the container.
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      localstack:
        image: localstack/localstack:4.4.0
        ports:
          - 4566:4566
        env:
          SERVICES: dynamodb,s3
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # No later step needs to push or fetch as this token, so it isn't
      # left sitting in the git config for anything that runs after.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # Runs before Build, because an untidy go.mod fails the build here
      # with "updates to go.mod needed" — which reads as a broken build
      # rather than a missing requirement. A warm module cache hides this
      # locally: `go build` succeeds on the developer's machine using a
      # package go.mod never recorded, and only a clean checkout notices.
      - name: Check go.mod is tidy
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::go.mod/go.sum are not tidy — run 'go mod tidy' in server/ and commit the result"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      # The container's health check only says the gateway is up; the
      # individual services come available after it.
      - name: Wait for DynamoDB and S3
        run: |
          for _ in $(seq 1 30); do
            health=$(curl -sf http://localhost:4566/_localstack/health || true)
            if printf '%s' "$health" | grep -Eq '"dynamodb": *"(available|running)"' &&
               printf '%s' "$health" | grep -Eq '"s3": *"(available|running)"'; then
              echo "ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::LocalStack never reported dynamodb and s3 as ready"
          echo "last health response: $health"
          exit 1

      # The complement of integration's Test step, computed rather than
      # listed, so a new package always lands in exactly one job.
      # REQUIRE_LOCALSTACK turns a dead container into a failure instead
      # of a quiet, all-green skip.
      - name: Test
        run: |
          go test -race $(go list ./... | grep -Ev '^circle-relay/integration(/|$)')
        env:
          REQUIRE_LOCALSTACK: '1'

  # The black-box suite alone: the relay driven over real HTTP the way a
  # client drives it. Gated on unit, so a broken build doesn't spend a
  # second container's boot time finding that out again.
  integration:
    name: Integration Tests
    needs: unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      localstack:
        image: localstack/localstack:4.4.0
        ports:
          - 4566:4566
        env:
          SERVICES: dynamodb,s3
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # No later step needs to push or fetch as this token, so it isn't
      # left sitting in the git config for anything that runs after.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # The container's health check only says the gateway is up; the
      # individual services come available after it.
      - name: Wait for DynamoDB and S3
        run: |
          for _ in $(seq 1 30); do
            health=$(curl -sf http://localhost:4566/_localstack/health || true)
            if printf '%s' "$health" | grep -Eq '"dynamodb": *"(available|running)"' &&
               printf '%s' "$health" | grep -Eq '"s3": *"(available|running)"'; then
              echo "ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::LocalStack never reported dynamodb and s3 as ready"
          echo "last health response: $health"
          exit 1

      # REQUIRE_LOCALSTACK turns a dead container into a failure instead
      # of a quiet, all-green skip.
      - name: Test
        run: go test -race ./integration/...
        env:
          REQUIRE_LOCALSTACK: '1'
